# Configuración de Read the Docs
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc            # nbsphinx lo necesita para convertir los notebooks

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - pdf

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip       # instala pycellid desde el repo (lee pyproject.toml)
      path: .
