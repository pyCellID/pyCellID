# =============================================================================
# BUILD SYSTEM: qué herramienta construye el paquete
# =============================================================================

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# =============================================================================
# PROJECT: metadata del paquete (PEP 621)
# =============================================================================

[project]
name = "pycellid"
dynamic = ["version"]
description = "Functions to analyze Cell-ID single-cell cytometry data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "José A. Clemente", email = "clemente.jac@gmail.com" },
    { name = "Juan David Ferreira" },
    { name = "Víctor San Martín" },
]
keywords = ["pycellid", "cytometry", "microscopy", "cellid", "vcellid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "attrs>=22.2",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/pyCellID/pyCellID"
Documentation = "https://pycellid.readthedocs.io"
Issues = "https://github.com/pyCellID/pyCellID/issues"
Changelog = "https://github.com/pyCellID/pyCellID/blob/main/CHANGELOG.rst"

# =============================================================================
# DEPENDENCY GROUPS: dependencias para desarrollar (PEP 735)
# No se publican en PyPI ni las instala el usuario final.
# =============================================================================

[dependency-groups]
test = ["pytest>=8", "pytest-cov"]
style = ["flake8", "flake8-import-order", "flake8-builtins", "pep8-naming"]
docstyle = ["pydocstyle[toml]"]
dev = [
    { include-group = "test" },
    { include-group = "style" },
    { include-group = "docstyle" },
    "check-manifest",
    "build",
    "twine",
    "tox>=4.22",
]

# =============================================================================
# SETUPTOOLS: configuración específica de la herramienta de build
# =============================================================================

[tool.setuptools]
packages = ["pycellid"]

[tool.setuptools.dynamic]
version = { attr = "pycellid.__version__" }

# =============================================================================
# OTRAS HERRAMIENTAS
# =============================================================================

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.check-manifest]
# Archivos versionados en git que a propósito NO van en el sdist
ignore = [
    ".github/**",
    ".gitignore",
    ".readthedocs.yaml",
    "docs/**",
    "samples_cellid/**",
    "tests/**",
    "tox.ini",
]
