[tox]
requires = tox>=4.22
envlist = py311, py312, py313, py314, py315, style, docstyle, check-manifest, coverage, docs
skip_missing_interpreters = true

# =============================================================================
# ENVS
# =============================================================================

[testenv]
dependency_groups = test
commands =
    pytest tests/ {posargs}


[testenv:style]
skip_install = true
dependency_groups = style
commands =
    flake8 tests/ pycellid/ {posargs}


[testenv:docstyle]
skip_install = true
dependency_groups = docstyle
commands =
    pydocstyle pycellid --convention=numpy


[testenv:check-manifest]
skip_install = true
deps = check-manifest
commands =
    check-manifest


[testenv:coverage]
dependency_groups = test
commands =
    pytest -q tests/ --cov=pycellid --cov-report=term-missing --cov-fail-under=95 --cov-report=xml


[testenv:docs]
description = Construir la documentación HTML con Sphinx
deps = -r {toxinidir}/docs/requirements.txt
changedir = docs
commands =
    sphinx-build -W --keep-going -b html -d {envtmpdir}/doctrees source {envtmpdir}/html


# =============================================================================
# FLAKE8 (no lee pyproject.toml, por eso su configuración vive acá)
# =============================================================================

[flake8]
# A005: el módulo pycellid.io comparte nombre con el módulo estándar "io".
# Renombrarlo rompería la API pública, así que se ignora a propósito.
extend-ignore = A005
